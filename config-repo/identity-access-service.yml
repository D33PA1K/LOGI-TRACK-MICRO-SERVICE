server:
  port: 8081

spring:
  application:
    name: identity-access-service
  datasource:
    url: jdbc:mysql://localhost:3306/logitrack_identity_access_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Resilience4j default config
resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3






jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  # Access token: deliberately short. A signed JWT cannot be revoked, so its
  # lifetime is the worst-case window during which a deactivated user still has
  # access. 30 minutes, not 24 hours.
  expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  # Refresh token: long-lived but stored server-side and revocable, so a session
  # can be ended immediately. 7 days.
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}






