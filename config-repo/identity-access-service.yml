server:
  port: 8081

spring:
  application:
    name: identity-access-service
  datasource:
    url: jdbc:mysql://localhost:3306/logitrack_identity_access_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Resilience4j default config
resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3






jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  # Single stateless access token, no refresh flow. Its lifetime is both the
  # session length and the worst-case window in which a just-deactivated user's
  # existing token still works, so it is a balance of usability vs. that window.
  # 24 hours by default.
  expiration: ${JWT_ACCESS_EXPIRATION:86400000}






